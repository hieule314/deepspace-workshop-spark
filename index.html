<!DOCTYPE html>
<html lang="en" data-theme="workshop" data-appearance="system" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="128x128" href="/workshop-spark-icon.png" />
    <title>Workshop Spark | Beginner computing activities</title>
    <style>
      /* Match the workshop theme before the stylesheet loads. */
      html {
        background-color: #f7f7f1;
        color-scheme: light;
      }
      html[data-color-scheme="dark"] { background-color: #15211a; color-scheme: dark; }
    </style>
    <script>
      let appearance;
      try {
        appearance = JSON.parse(localStorage.getItem('workshop.preferences') || '{}')?.appearance;
      } catch {
        // If storage is unavailable, use the system preference.
      }
      if (appearance === 'light' || appearance === 'dark') {
        document.documentElement.dataset.colorScheme = appearance;
      } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.colorScheme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
